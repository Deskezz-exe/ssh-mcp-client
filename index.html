<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applied before first paint so switching pages/reloading never
      // flashes the default theme before the saved one kicks in.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          document.documentElement.setAttribute(
            "data-theme",
            t === "light" || t === "hacker" || t === "claude" ? t : "dark",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ssh-mcp-client</title>
    <script type="module" src="/src/main.ts" defer></script>
    <script type="module" src="/src/terminal.ts" defer></script>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <div id="tab-bar">
        <div id="tab-home" class="tab active">🏠 Серверы</div>
        <div id="session-tabs"></div>
        <div id="tab-bar-spacer"></div>
        <button id="settings-btn" type="button" title="Настройки">⚙</button>
      </div>

      <main id="main">
        <section id="dashboard">
          <div id="server-grid"></div>
          <button id="add-server-btn" type="button">+ Добавить сервер</button>
        </section>

        <div id="terminals"></div>
      </main>
    </div>

    <div id="add-server-overlay">
      <form id="add-server-form">
        <h3>Новый сервер</h3>
        <input id="f-name" placeholder="Название" required />
        <input id="f-host" placeholder="Хост (IP или домен)" required />
        <input id="f-port" placeholder="Порт" value="22" required />
        <input id="f-username" placeholder="Пользователь" required />
        <input id="f-password" placeholder="Пароль" type="password" required />
        <div id="add-server-actions">
          <button type="button" id="add-server-cancel">Отмена</button>
          <button type="submit">Добавить</button>
        </div>
      </form>
    </div>

    <div id="settings-overlay">
      <div id="settings-panel">
        <div id="settings-header">
          <span>Настройки</span>
          <button id="settings-close" type="button">×</button>
        </div>
        <div id="settings-body">
          <h4>Тема</h4>
          <div id="theme-grid"></div>
        </div>
      </div>
    </div>
  </body>
</html>
