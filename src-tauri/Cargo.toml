[package]
name = "ssh-mcp-client"
version = "0.1.0"
description = "Personal SSH client with an embedded MCP server"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ssh_mcp_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63.2", default-features = false, features = ["ring", "flate2", "rsa"] }
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
base64 = "0.23.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

