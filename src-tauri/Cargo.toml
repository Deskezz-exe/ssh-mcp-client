[package]
name = "ssh-mcp-client"
version = "0.1.0"
description = "Personal SSH client with an embedded MCP server"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ssh_mcp_client_lib"
# "staticlib"/"cdylib" are only needed for iOS/Android FFI bridging. This is
# a Windows desktop app where main.rs links the lib the normal Rust way, so
# "rlib" alone is enough — and produces far fewer/smaller build artifacts,
# which also avoids antivirus-scan lock races on large freshly-written
# archives (see git history for what this was chasing).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63.2", default-features = false, features = ["ring", "flate2", "rsa"] }
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
base64 = "0.23.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-util = "0.7.19"
schemars = "1.2.2"
chrono = { version = "0.4.45", features = ["serde"] }
axum = "0.8.9"
regex = "1.13.1"

# Trimmed debug info: much smaller/faster intermediate build artifacts,
# which also helps avoid antivirus-scan lock races on Windows (see the
# crate-type comment above). Line-table-only debug info still gives usable
# stack traces.
[profile.dev]
debug = "line-tables-only"

